<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4f0"><title>Momentum</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><main class="wrap"><div class="topline"><div class="brand"><span class="brand-mark"></span> Momentum</div><div class="top-actions"><span class="sync-status" id="sync-status" role="status" aria-live="polite">Connecting…</span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.6 8.6 0 1 0 20.2 15.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div>
<header class="intro"><div><h1>Momentum</h1></div><div class="clock" aria-label="Current time in Europe/Paris"><div class="clock-time" id="clock">--:--</div><div class="clock-date" id="clock-date"></div></div></header>
<nav class="view-nav" aria-label="Task views"><button type="button" data-view="today" aria-current="page">Today</button><button type="button" data-view="focus" aria-current="false">Focus</button></nav>
<section id="app" aria-live="polite" aria-busy="true"></section><dialog id="timer-settings-dialog" class="timer-dialog" aria-labelledby="timer-settings-heading"><form id="timer-settings" class="timer-settings"><div class="timer-settings-heading"><h4 id="timer-settings-heading">Timer settings</h4><button class="icon-button" type="button" data-action="timer-settings-close" aria-label="Close timer settings" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="timer-settings-grid"><label for="timer-work">Work minutes<input id="timer-work" name="workMinutes" type="number" min="1" max="180" step="1" required value="25"></label><label for="timer-short">Short break minutes<input id="timer-short" name="shortBreakMinutes" type="number" min="1" max="180" step="1" required value="5"></label><label for="timer-long">Long break minutes<input id="timer-long" name="longBreakMinutes" type="number" min="1" max="180" step="1" required value="15"></label><label for="timer-interval">Long break after work sessions<input id="timer-interval" name="longBreakInterval" type="number" min="1" max="12" step="1" required value="4"></label></div><div class="timer-settings-actions"><button class="timer-cancel" type="button" data-action="timer-settings-close">Cancel</button><button class="timer-save" type="submit" aria-label="Save timer settings" title="Save timer settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h13l3 3v13H4V4Zm3 0v6h10V4M7 20v-7h10v7M9 4v4h5V4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button></div></form></dialog></main><script src="timer.js" defer></script><script src="app.js" defer></script></body></html>
