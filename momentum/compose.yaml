name: momentum

services:
  momentum-api:
    build: .
    restart: unless-stopped
    command:
      - python
      - -B
      - server/app.py
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --db-file
      - /state/tasks.sqlite3
      - --allow-non-loopback
    volumes:
      - momentum-state:/state
    networks:
      - shoji-backends
    expose:
      - "8766"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/day-reset-api/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  momentum-state:

networks:
  shoji-backends:
    external: true
    name: shoji-backends
